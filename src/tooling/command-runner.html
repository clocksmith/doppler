<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doppler Command Runner</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
          'Courier New', monospace;
        background: #0f1115;
        color: #c5cedd;
      }

      main {
        padding: 10px 12px;
      }

      .muted {
        color: #8592a6;
      }
    </style>
  </head>
  <body>
    <main>
      <div>Doppler browser command surface</div>
      <div class="muted">Ready for Node relay execution.</div>
    </main>
    <script type="module">
      const cacheKey = new URLSearchParams(globalThis.location.search).get('_dopplerRunner') || `${Date.now()}`;
      const [{ runBrowserCommand }, { ensureModelCached }, { loadPersistentModelSource }] = await Promise.all([
        import(`./browser-command-runner.js?_dopplerRunner=${encodeURIComponent(cacheKey)}`),
        import(`./opfs-cache.js?_dopplerRunner=${encodeURIComponent(cacheKey)}`),
        import(`../storage/model-cache.js?_dopplerRunner=${encodeURIComponent(cacheKey)}`),
      ]);

      window.__dopplerRunBrowserCommand = async (request, options = {}) => {
        return runBrowserCommand(request, options || {});
      };
      window.__dopplerEnsureCached = (modelId, modelBaseUrl) => {
        return ensureModelCached(modelId, modelBaseUrl);
      };
      // This deliberately narrow helper belongs to the local qualification
      // runner, not the public command protocol. A caller can corrupt exactly
      // one cached model file between cache verification and an OPFS-only load
      // to demonstrate rejection and subsequent recovery from immutable source.
      window.__dopplerCorruptCachedModelForQualification = async (modelId) => {
        const safeModelId = String(modelId || '').replace(/[^a-zA-Z0-9_-]/g, '_');
        if (!safeModelId) {
          throw new Error('Qualification corruption requires modelId.');
        }
        const root = await navigator.storage.getDirectory();
        const models = await root.getDirectoryHandle('doppler-models', { create: false });
        const model = await models.getDirectoryHandle(safeModelId, { create: false });
        const manifestHandle = await model.getFileHandle('manifest.json', { create: false });
        const manifest = JSON.parse(await (await manifestHandle.getFile()).text());
        const shardFilenames = Array.isArray(manifest?.shards)
          ? manifest.shards.map((shard) => String(shard?.filename || '')).filter(Boolean)
          : [];
        if (shardFilenames.length === 0) {
          throw new Error(`Qualification corruption found no manifest-declared shards for ${safeModelId}.`);
        }
        const getNestedFileHandle = async (filename) => {
          const segments = filename.replace(/\\/g, '/').split('/').filter(Boolean);
          const leaf = segments.pop();
          if (!leaf || segments.some((segment) => segment === '.' || segment === '..')) {
            throw new Error(`Qualification corruption received invalid shard path ${filename}.`);
          }
          let directory = model;
          for (const segment of segments) {
            directory = await directory.getDirectoryHandle(segment, { create: false });
          }
          return directory.getFileHandle(leaf, { create: false });
        };
        const targetFilename = [...shardFilenames].sort((left, right) => left.localeCompare(right))[0];
        const targetHandle = await getNestedFileHandle(targetFilename);
        const bytes = new Uint8Array(await (await targetHandle.getFile()).arrayBuffer());
        if (bytes.length === 0) {
          throw new Error(`Qualification corruption found empty cached shard ${targetFilename}.`);
        }
        bytes[Math.min(17, bytes.length - 1)] ^= 0xff;
        const writable = await targetHandle.createWritable();
        await writable.write(bytes);
        await writable.close();
        return { modelId: safeModelId, filename: targetFilename, bytes: bytes.length };
      };
      window.__dopplerVerifyCachedModelForQualification = (modelId) => {
        return loadPersistentModelSource(modelId);
      };
      window.__dopplerRunnerReady = true;
    </script>
  </body>
</html>
