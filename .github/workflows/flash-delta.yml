name: Actual Flash recurrent attention encrypted integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flash-delta.yml'
      - 'tools/privacy-concrete/**'
permissions:
  contents: read
jobs:
  actual-delta:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[flash-delta-e2e]')
    concurrency:
      group: actual-flash-delta
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '4'
      RAYON_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU implementation
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Check exact reference arithmetic and tensor materialization
        env:
          DOPPLER_CONCRETE_NATIVE: '1'
        run: python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_native.py -v
      - name: Provision whole immutable attention shard and inspected source
        run: |
          python tools/privacy-concrete/flash_weights.py --scope linear-attention --destination "$RUNNER_TEMP/flash-source"
          PYTHONPATH=tools/privacy-concrete python - "$RUNNER_TEMP/flash-reference" <<'PY'
          import sys
          from flash_reference import provision_reference
          provision_reference(sys.argv[1])
          PY
      - name: Execute actual first-layer cached attention encrypted projections
        run: |
          python tools/privacy-concrete/flash_delta_model.py \
            --source-dir "$RUNNER_TEMP/flash-source" \
            --cache-dir "$RUNNER_TEMP/flash-public-cache" \
            --reference-source "$RUNNER_TEMP/flash-reference/modeling_qwen4_exp.py" \
            > "$RUNNER_TEMP/flash-delta-public-result.json" \
            2> "$RUNNER_TEMP/flash-delta-client-diagnostics.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: actual-flash-delta-public-evidence
          path: ${{ runner.temp }}/flash-delta-public-result.json
          if-no-files-found: warn
          retention-days: 7
