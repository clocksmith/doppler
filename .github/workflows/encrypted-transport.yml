name: Encrypted evaluator transport
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-transport.yml'
      - 'tools/privacy-concrete/ssh*'
      - 'tools/privacy-concrete/test_ssh*'
      - 'tools/privacy-concrete/protocol.py'
permissions:
  contents: read
jobs:
  pinned-ssh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Provision isolated test-only SSH daemon
        run: |
          sudo apt-get update -qq
          saved_policy="$RUNNER_TEMP/policy-rc.d.original"
          if test -e /usr/sbin/policy-rc.d; then
            sudo cp -p /usr/sbin/policy-rc.d "$saved_policy"
          fi
          restore_policy() {
            if test -e "$saved_policy"; then
              sudo cp -p "$saved_policy" /usr/sbin/policy-rc.d
            else
              sudo rm /usr/sbin/policy-rc.d
            fi
          }
          trap restore_policy EXIT
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod 0755 /usr/sbin/policy-rc.d
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo install -d -m 0755 /run/sshd
      - name: Route admission and real loopback authentication
        env:
          DOPPLER_SSH_INTEGRATION: '1'
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_ssh_route.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_ssh_transport.py -v
