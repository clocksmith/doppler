name: Full Qwen 12-bit encrypted model candidate
on:
  workflow_dispatch:
    inputs:
      public_fixture:
        description: Installed fixed public Qwen fixture
        type: choice
        required: true
        default: qwen05b-capital
        options: [qwen05b-capital, qwen05b-arithmetic]
  push:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-qwen-ntt12.yml'
      - 'tools/privacy-concrete/**'
permissions:
  contents: read
jobs:
  all-linear-ntt:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-ntt12-e2e]') || contains(github.event.head_commit.message, '[qwen-ntt12-arithmetic-e2e]')
    concurrency:
      group: encrypted-qwen-ntt12
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PUBLIC_FIXTURE: ${{ inputs.public_fixture || (contains(github.event.head_commit.message, '[qwen-ntt12-arithmetic-e2e]') && 'qwen05b-arithmetic') || 'qwen05b-capital' }}
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.91.1'
      OMP_NUM_THREADS: '4'
      RAYON_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU client and build tooling
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          python -m pip install --no-cache-dir 'maturin==1.16.0'
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Prepare exact native source and retained dependency lock
        run: |
          python tools/privacy-concrete/native-ntt/prepare.py --destination "$RUNNER_TEMP/concrete-ntt-source"
          cargo generate-lockfile --locked --manifest-path "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.toml"
          python tools/privacy-concrete/native-ntt/check_lock.py "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock"
      - name: Build the separate CPU-only arithmetic variant
        working-directory: ${{ runner.temp }}/concrete-ntt-source
        run: maturin build --manifest-path rust/Cargo.toml --no-default-features --features python_bindings --profile release_lto_off --locked --out "$RUNNER_TEMP/ntt-wheels" --interpreter python
      - name: Install and verify actual native implementation identity
        run: |
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/ntt-wheels/*.whl
          PYTHONPATH=tools/privacy-concrete python -c 'from native_runtime import ntt_versions; print(ntt_versions())'
      - name: Verify ciphertext equivalence before using the changed implementation
        run: |
          python tools/privacy-concrete/native-ntt/benchmark.py --lock "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock" \
            > "$RUNNER_TEMP/ntt-public-result.json" 2> "$RUNNER_TEMP/ntt-private-diagnostics.txt"
      - name: Check complete route admission and evidence boundaries
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_full_admission.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_full_evidence.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_source_snapshot.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_native_runtime.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_weight_encoding.py -v
          DOPPLER_CONCRETE_NATIVE=1 python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_native.py -v
          PYTHONPATH=tools/privacy-concrete python tools/privacy-concrete/native-ntt/test_integrity.py -v
      - name: Provision exact public Qwen source
        run: python tools/privacy-concrete/prepare.py --profile qwen05b-k-projection --destination "$RUNNER_TEMP/qwen-source"
      - name: Validate the declared 12-bit message-domain boundary before model execution
        run: |
          python tools/privacy-concrete/qwen12_domain_probe.py --model-dir "$RUNNER_TEMP/qwen-source" --cache-dir "$RUNNER_TEMP/qwen-probe-cache" \
            > "$RUNNER_TEMP/qwen-fhe-precision-probe.json" 2> "$RUNNER_TEMP/qwen-fhe-probe-private-diagnostics.txt"
      - name: Retain the completed public paired probe before the long model attempt
        uses: actions/upload-artifact@v6
        with:
          name: qwen-ntt12-public-domain-probe
          path: ${{ runner.temp }}/qwen-fhe-precision-probe.json
          if-no-files-found: error
          retention-days: 7
      - name: Execute all 169 linear modules and head for four encrypted steps
        run: |
          python tools/privacy-concrete/full_model.py \
            --model-dir "$RUNNER_TEMP/qwen-source" \
            --cache-dir "$RUNNER_TEMP/qwen-public-cache" \
            --backend-profile qwen-all-linear-ntt12 \
            --public-fixture "$PUBLIC_FIXTURE" \
            > "$RUNNER_TEMP/full-qwen-result.json" 2> "$RUNNER_TEMP/full-qwen-progress.jsonl"
      - name: Construct public fixture evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/public-evidence"
          python tools/privacy-concrete/collect_full_evidence.py \
            --report "$RUNNER_TEMP/full-qwen-result.json" --progress "$RUNNER_TEMP/full-qwen-progress.jsonl" \
            --fixture "$PUBLIC_FIXTURE" --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/public-evidence/full-qwen.json"
          if test -f "$RUNNER_TEMP/qwen-fhe-precision-probe.json"; then cp "$RUNNER_TEMP/qwen-fhe-precision-probe.json" "$RUNNER_TEMP/public-evidence/qwen-fhe-precision-probe.json"; fi
          if test -f "$RUNNER_TEMP/ntt-public-result.json"; then cp "$RUNNER_TEMP/ntt-public-result.json" "$RUNNER_TEMP/public-evidence/native-ntt.json"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-qwen-ntt12-public-evidence
          path: ${{ runner.temp }}/public-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
