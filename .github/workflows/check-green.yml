name: Smoke

# Automatic CI checks source contracts and the installed package without GPUs, browsers, or model downloads.
# Hardware and browser qualification stay in the manual workflows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm run check:fast
      - run: npm run style:guides:check
      - run: npm run style:guides:test
      - run: npm run package:smoke
