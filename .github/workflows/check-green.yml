name: Default Green Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOPPLER_POLICY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      DOPPLER_ARCHITECTURE_DEBT_AUTHORIZATION: ${{ vars.DOPPLER_ARCHITECTURE_DEBT_AUTHORIZATION }}
      DOPPLER_MODEL_FAMILY_AUTHORIZATION: ${{ vars.DOPPLER_MODEL_FAMILY_AUTHORIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Sync package source closure
        run: npm run package:closure:sync

      - name: Run CI contract tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:ci

      - name: Check kernel registries
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run kernels:check

      - name: Run repository acceptance checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run check:green

      - name: Run browser WebGPU kernel contract
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:gpu:browser

      - name: Run demo UI and offline PWA contract
        if: ${{ !cancelled() && steps.chromium.outcome == 'success' }}
        run: npm run test:demo:contract
