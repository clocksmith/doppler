name: Smoke

# Automatic CI checks source contracts and the installed package without GPUs, browsers, or model downloads.
# Hardware and browser qualification stay in the manual workflows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOPPLER_POLICY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
      DOPPLER_ARCHITECTURE_DEBT_AUTHORIZATION: ${{ secrets.DOPPLER_ARCHITECTURE_DEBT_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Fetch policy comparison revision
        run: |
          if ! git cat-file -e "$DOPPLER_POLICY_BASE_REF^{commit}"; then
            git fetch --no-tags --depth=1 origin "$DOPPLER_POLICY_BASE_REF"
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: node tests/inference/execution-backend-contract.test.js
      - run: node tests/config/runtime-transform-ownership.test.js
      - run: node tests/integration/execution-graph-transforms.test.js
      - run: npm run check:fast
      - run: npm run style:guides:check
      - run: npm run style:guides:test
      - run: npm run package:smoke

  privacy-protocol-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix tools/privacy-demo --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix tools/privacy-demo
      - run: python3 -m unittest discover -s tools/privacy-concrete -p 'test_*.py' -v
