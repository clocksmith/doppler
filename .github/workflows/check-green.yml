name: Smoke

# Hosted CI is a smoke test: behavior suites, the packed package, and the demo.
# Config, policy, mirror, and freshness checks (npm run check:green,
# kernels:check) and GPU kernel contracts run on demand, not on every push.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # No smoke step uses onnxruntime-node; skip its binary download.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure software Vulkan for hosted smoke
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers
          icd=$(dpkg -L mesa-vulkan-drivers | awk '/\/lvp_icd(\.[^/]*)?\.json$/ { print; exit }')
          test -n "$icd" && test -f "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          cat "$icd"
        # Lavapipe executes WGSL on the CPU. This smoke is not hardware qualification.
        # https://dawn.googlesource.com/dawn/+/refs/heads/main/src/dawn/node/README.md

      - name: Behavior tests
        run: npm run test:smoke

      - name: Node WebGPU and browser unit tests
        run: |
          npm run test:unit:webgpu
          npm run test:unit:browser

      - name: Packed package smoke
        run: npm run package:smoke

      - name: Demo UI and offline PWA smoke
        run: npm run test:demo:contract
