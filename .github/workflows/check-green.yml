name: Default Green Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-green:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync package source closure
        run: npm run package:closure:sync

      - name: Run deterministic CPU contract
        run: npm run ci:check

      - name: Run browser WebGPU kernel contract
        run: npm run test:gpu:browser

      - name: Run demo UI and offline PWA contract
        run: npm run test:demo:contract
