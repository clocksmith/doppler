name: Smoke

# Automatic CI checks the installed package without GPUs, browsers, or model downloads.
# Hardware and browser qualification stay in the manual workflows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOPPLER_ARCHITECTURE_DEBT_AUTHORIZATION: ${{ vars.DOPPLER_ARCHITECTURE_DEBT_AUTHORIZATION }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm run source:architecture:check
        env:
          DOPPLER_POLICY_BASE_REF: HEAD^
      - run: npm run package:smoke
