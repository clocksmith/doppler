name: Actual Flash all-expert exact-arithmetic execution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flash-moe-ntt.yml'
      - 'tools/privacy-concrete/**'
permissions:
  contents: read
jobs:
  all-expert-ntt:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[flash-moe-ntt-e2e]')
    concurrency:
      group: actual-flash-dense-moe-ntt
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.91.1'
      OMP_NUM_THREADS: '4'
      RAYON_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU client and build tooling
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          python -m pip install --no-cache-dir 'maturin==1.16.0'
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Prepare exact native source and retained dependency lock
        run: |
          python tools/privacy-concrete/native-ntt/prepare.py --destination "$RUNNER_TEMP/concrete-ntt-source"
          cargo generate-lockfile --locked --manifest-path "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.toml"
          python tools/privacy-concrete/native-ntt/check_lock.py "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock"
      - name: Build the separate CPU-only arithmetic variant
        working-directory: ${{ runner.temp }}/concrete-ntt-source
        run: maturin build --manifest-path rust/Cargo.toml --no-default-features --features python_bindings --profile release_lto_off --locked --out "$RUNNER_TEMP/ntt-wheels" --interpreter python
      - name: Install and verify actual native implementation identity
        run: |
          python -m pip install --no-deps --force-reinstall "$RUNNER_TEMP"/ntt-wheels/*.whl
          PYTHONPATH=tools/privacy-concrete python -c 'from native_runtime import ntt_versions; print(ntt_versions())'
      - name: Verify ciphertext equivalence before using the changed implementation
        run: |
          python tools/privacy-concrete/native-ntt/benchmark.py --lock "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock" \
            > "$RUNNER_TEMP/ntt-public-result.json" 2> "$RUNNER_TEMP/ntt-private-diagnostics.txt"
      - name: Check explicit all-expert native admission and evidence
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_plan.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_moe_evidence.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_full_admission.py -v
          DOPPLER_CONCRETE_NATIVE=1 python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_native.py -v
          PYTHONPATH=tools/privacy-concrete python tools/privacy-concrete/native-ntt/test_integrity.py -v
      - name: Provision whole pinned public MoE source objects
        run: python tools/privacy-concrete/flash_weights.py --destination "$RUNNER_TEMP/flash-source"
      - name: Execute complete shared, router and 512-expert encrypted NTT route
        run: |
          python tools/privacy-concrete/flash_moe.py --source-dir "$RUNNER_TEMP/flash-source" --cache-dir "$RUNNER_TEMP/flash-public-cache" --execution encrypted --backend-profile flash-dense-moe-ntt > "$RUNNER_TEMP/flash-moe-result.json" 2> "$RUNNER_TEMP/flash-moe-client-diagnostics.txt"
      - name: Construct bounded public fixture evidence on success or failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/public-evidence"
          python tools/privacy-concrete/collect_moe_evidence.py --report "$RUNNER_TEMP/flash-moe-result.json" --progress "$RUNNER_TEMP/flash-moe-client-diagnostics.txt" --revision "$GITHUB_SHA" --backend-profile flash-dense-moe-ntt --output "$RUNNER_TEMP/public-evidence/flash-moe.json"
          if test -f "$RUNNER_TEMP/ntt-public-result.json"; then cp "$RUNNER_TEMP/ntt-public-result.json" "$RUNNER_TEMP/public-evidence/native-ntt.json"; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: actual-flash-dense-moe-ntt-public-evidence
          path: ${{ runner.temp }}/public-evidence/*.json
          if-no-files-found: warn
          retention-days: 7
