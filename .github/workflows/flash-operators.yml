name: Flash operator reference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flash-operators.yml'
      - 'tools/privacy-concrete/oblivious_experts.py'
      - 'tools/privacy-concrete/flash_hyper_ops.py'
      - 'tools/privacy-concrete/flash_reference.py'
      - 'tools/privacy-concrete/flash-reference-programs.json'
      - 'tools/privacy-concrete/flash_delta.py'
      - 'tools/privacy-concrete/flash_attention.py'
      - 'tools/privacy-concrete/flash_ple.py'
      - 'tools/privacy-concrete/flash_ple_state.py'
      - 'tools/privacy-concrete/flash-ple-program.json'
      - 'tools/privacy-concrete/test_flash_ple_reference.py'
      - 'tools/privacy-concrete/flash_attention_state.py'
      - 'tools/privacy-concrete/flash-attention-program.json'
      - 'tools/privacy-concrete/flash_client_projections.py'
      - 'tools/privacy-concrete/flash_request_state.py'
      - 'tools/privacy-concrete/flash_model_state.py'
      - 'tools/privacy-concrete/flash_model_graph.py'
      - 'tools/privacy-concrete/flash_text_config.py'
      - 'tools/privacy-concrete/flash_model_assembly.py'
      - 'tools/privacy-concrete/test_flash_text_config.py'
      - 'tools/privacy-concrete/test_flash_model_reference.py'
      - 'tools/privacy-concrete/test_flash_attention_reference.py'
      - 'tools/privacy-concrete/flash_delta_state.py'
      - 'tools/privacy-concrete/test_flash_delta_reference.py'
      - 'tools/privacy-concrete/test_flash_reference.py'
      - 'tools/privacy-concrete/flash-readiness.json'
      - 'tools/privacy-concrete/flash-ngram-storage.json'
      - 'tools/privacy-concrete/local_ngram_rows.py'
      - 'tools/privacy-concrete/local_bf16_rows.py'
      - 'tools/privacy-concrete/local_token_rows.py'
      - 'tools/privacy-concrete/local_token_embedding.py'
      - 'tools/privacy-concrete/test_local_token_embedding_reference.py'
      - 'tools/privacy-concrete/local_ngram_embedding.py'
      - 'tools/privacy-concrete/test_flash_ple_local_reference.py'
      - 'tools/privacy-concrete/test_local_ngram_rows.py'
      - 'tools/privacy-concrete/test_ngram_mapping_reference.py'
      - 'tools/privacy-concrete/flash_rotary.py'
      - 'tools/privacy-concrete/test_flash_rotary_reference.py'
permissions:
  contents: read
jobs:
  source-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU reference
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'numpy==1.26.4'
      - name: Provision exact inspected official reference source
        run: |
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          source=json.loads(Path('tools/privacy-concrete/flash-readiness.json').read_text())['operatorReference']
          target=Path(os.environ['RUNNER_TEMP'])/'flash-reference';target.mkdir()
          for name,item in source['files'].items():
              with urllib.request.urlopen(item['url'],timeout=30) as response:data=response.read()
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise ValueError('Pinned source mismatch')
              (target/name).write_bytes(data)
          extra=json.loads(Path('tools/privacy-concrete/flash-ngram-storage.json').read_text())['conversionReference']
          for name,item in extra['files'].items():
              path=target/name
              if path.exists():data=path.read_bytes()
              else:
                  with urllib.request.urlopen(item['url'],timeout=30) as response:data=response.read(1024*1024+1)
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise ValueError('Pinned conversion source mismatch')
              if not path.exists():path.write_bytes(data)
          text=json.loads(Path('tools/privacy-concrete/flash-text-weights.json').read_text())
          url=f"https://huggingface.co/{text['repository']}/resolve/{text['revision']}/config.json"
          with urllib.request.urlopen(url,timeout=30) as response:data=response.read(1024*1024+1)
          if hashlib.sha256(data).hexdigest()!=text['configSha256']:raise ValueError('Pinned full-model configuration mismatch')
          (target/'checkpoint-config.json').write_bytes(data)
          PY
      - name: Compare MoE and four-step hyperconnection branch against official FP32 reference
        env:
          DOPPLER_FLASH_REFERENCE: '1'
          DOPPLER_FLASH_SOURCE_DIR: ${{ runner.temp }}/flash-reference
          OMP_NUM_THREADS: '2'
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_flash_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_delta_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_attention_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_ple_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_ple_local_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_local_ngram_rows.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_ngram_mapping_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_rotary_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_model_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_local_token_embedding_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_text_config.py -v
      - name: Retain source-bound complete-model geometry without weight or inference claims
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python tools/privacy-concrete/flash_model_assembly.py \
            --config "$RUNNER_TEMP/flash-reference/checkpoint-config.json" \
            --reference-source "$RUNNER_TEMP/flash-reference/modeling_qwen4_exp.py" > "$RUNNER_TEMP/flash-client-geometry.json"
      - uses: actions/upload-artifact@v6
        with:
          name: flash-complete-client-geometry
          path: ${{ runner.temp }}/flash-client-geometry.json
          if-no-files-found: error
          retention-days: 7
