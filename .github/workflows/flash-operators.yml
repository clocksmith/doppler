name: Flash operator reference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flash-operators.yml'
      - 'tools/privacy-concrete/oblivious_experts.py'
      - 'tools/privacy-concrete/flash_hyper_ops.py'
      - 'tools/privacy-concrete/flash_reference.py'
      - 'tools/privacy-concrete/flash-reference-programs.json'
      - 'tools/privacy-concrete/flash_delta.py'
      - 'tools/privacy-concrete/flash_attention.py'
      - 'tools/privacy-concrete/flash_attention_state.py'
      - 'tools/privacy-concrete/flash-attention-program.json'
      - 'tools/privacy-concrete/flash_client_projections.py'
      - 'tools/privacy-concrete/flash_request_state.py'
      - 'tools/privacy-concrete/test_flash_attention_reference.py'
      - 'tools/privacy-concrete/flash_delta_state.py'
      - 'tools/privacy-concrete/test_flash_delta_reference.py'
      - 'tools/privacy-concrete/test_flash_reference.py'
      - 'tools/privacy-concrete/flash-readiness.json'
permissions:
  contents: read
jobs:
  source-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU reference
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir 'numpy==1.26.4'
      - name: Provision exact inspected official reference source
        run: |
          python - <<'PY'
          import hashlib,json,os,urllib.request
          from pathlib import Path
          source=json.loads(Path('tools/privacy-concrete/flash-readiness.json').read_text())['operatorReference']
          target=Path(os.environ['RUNNER_TEMP'])/'flash-reference';target.mkdir()
          for name,item in source['files'].items():
              with urllib.request.urlopen(item['url'],timeout=30) as response:data=response.read()
              if hashlib.sha256(data).hexdigest()!=item['sha256']:raise ValueError('Pinned source mismatch')
              (target/name).write_bytes(data)
          PY
      - name: Compare MoE and four-step hyperconnection branch against official FP32 reference
        env:
          DOPPLER_FLASH_REFERENCE: '1'
          DOPPLER_FLASH_SOURCE_DIR: ${{ runner.temp }}/flash-reference
          OMP_NUM_THREADS: '2'
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_flash_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_delta_reference.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_attention_reference.py -v
