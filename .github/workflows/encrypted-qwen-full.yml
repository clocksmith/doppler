name: Full encrypted Qwen qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-qwen-full.yml'
      - 'tools/privacy-concrete/**'

permissions:
  contents: read

# Keep the named long-running validation independent of ordinary push CI and A1 hardware.
concurrency:
  group: encrypted-qwen-full
  cancel-in-progress: false

jobs:
  qwen-all-linear:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[encrypted-qwen-e2e]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '4'
      VECLIB_MAXIMUM_THREADS: '4'
      RAYON_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU-only implementation
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt
          # Validate the implementation actually used; optional XGBoost's old wheel
          # platform metadata is unrelated to this GLWE/Torch execution route.
          PYTHONPATH=tools/privacy-concrete python -c 'import torch, concrete_ml_extensions; from concrete.ml.quantization.linear_op_glwe_backend import GLWELinearLayerExecutor; from full_plan import implementation_versions; print(implementation_versions())'
      - name: Focused width and plan checks
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_full_plan.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_full_admission.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_full_evidence.py -v
          DOPPLER_CONCRETE_NATIVE=1 python -m unittest discover -s tools/privacy-concrete -p test_full_native.py -v
      - name: Provision exact public Qwen source
        run: python tools/privacy-concrete/prepare.py --profile qwen05b-k-projection --destination "$RUNNER_TEMP/qwen-source"
      - name: Execute all layers and vocabulary head for four encrypted steps
        run: |
          python tools/privacy-concrete/full_model.py \
            --model-dir "$RUNNER_TEMP/qwen-source" \
            --cache-dir "$RUNNER_TEMP/qwen-public-cache" \
            --public-fixture qwen05b-capital \
            > "$RUNNER_TEMP/full-qwen-result.json" \
            2> "$RUNNER_TEMP/full-qwen-progress.jsonl"
      - name: Construct public evidence only
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/public-evidence"
          python tools/privacy-concrete/collect_full_evidence.py \
            --report "$RUNNER_TEMP/full-qwen-result.json" \
            --progress "$RUNNER_TEMP/full-qwen-progress.jsonl" \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/public-evidence/full-qwen.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-qwen-public-evidence
          path: ${{ runner.temp }}/public-evidence/full-qwen.json
          if-no-files-found: warn
          retention-days: 7
