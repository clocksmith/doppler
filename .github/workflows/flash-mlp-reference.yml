name: Actual Flash MLP source comparison
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flash-mlp-reference.yml'
      - 'tools/privacy-concrete/flash_sparse_reference.py'
      - 'tools/privacy-concrete/flash_mlp.py'
permissions:
  contents: read
jobs:
  actual-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      RAYON_NUM_THREADS: '4'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU source-reference implementation
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Provision whole pinned public MLP shards and inspected source
        run: |
          python tools/privacy-concrete/flash_weights.py --scope mlp-block --destination "$RUNNER_TEMP/flash-source"
          PYTHONPATH=tools/privacy-concrete python - "$RUNNER_TEMP/flash-reference" <<'PY'
          import sys
          from flash_reference import provision_reference
          provision_reference(sys.argv[1])
          PY
      - name: Compare dense client route with actual official sparse MLP
        run: |
          python tools/privacy-concrete/flash_mlp.py \
            --source-dir "$RUNNER_TEMP/flash-source" \
            --cache-dir "$RUNNER_TEMP/flash-public-cache" \
            --reference-source "$RUNNER_TEMP/flash-reference/modeling_qwen4_exp.py" \
            --execution public-reference \
            > "$RUNNER_TEMP/flash-mlp-source-public-result.json" \
            2> "$RUNNER_TEMP/flash-mlp-source-client-diagnostics.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: actual-flash-mlp-source-public-evidence
          path: ${{ runner.temp }}/flash-mlp-source-public-result.json
          if-no-files-found: warn
          retention-days: 7
