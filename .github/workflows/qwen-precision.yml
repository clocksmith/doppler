name: Qwen source precision boundary and clear control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qwen-precision.yml'
      - 'tools/privacy-concrete/**'
permissions:
  contents: read
jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[qwen-precision]')
    concurrency:
      group: qwen-precision-control
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '4'
      RAYON_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU reference implementation
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Check shared prefill/decode and integer reference contracts
        env:
          DOPPLER_CONCRETE_NATIVE: '1'
        run: python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_native.py -v
      - name: Provision whole immutable public Qwen source
        run: python tools/privacy-concrete/prepare.py --profile qwen05b-k-projection --destination "$RUNNER_TEMP/qwen-source"
      - name: Compare all layers on fixed public quality fixtures without keys or encryption
        run: |
          python tools/privacy-concrete/quantization_probe.py --model-dir "$RUNNER_TEMP/qwen-source" --cache-dir "$RUNNER_TEMP/qwen-public-cache" \
            > "$RUNNER_TEMP/qwen-precision-public-result.json" 2> "$RUNNER_TEMP/qwen-precision-client-diagnostics.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qwen-public-precision-evidence
          path: ${{ runner.temp }}/qwen-precision-public-result.json
          if-no-files-found: warn
          retention-days: 7
