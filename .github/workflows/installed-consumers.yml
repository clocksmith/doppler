name: Installed standalone and Reploid consumers

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          # These public-package contracts do not execute the ONNX reference backend.
          ONNXRUNTIME_NODE_INSTALL: skip
      - name: Build one archive and accept its standalone consumer
        run: node tools/check-packed-package.js --retain "$RUNNER_TEMP/doppler-candidate"
      - name: Checkout the reviewed Reploid consumer
        uses: actions/checkout@v7
        with:
          repository: clocksmith/reploid
          ref: 477670567d13df536157815560baf8c987948331
          path: .consumer-reploid
      - name: Require Reploid acceptance of the same installed archive
        env:
          DOPPLER_TEST_REQUIRED: '1'
          DOPPLER_TEST_CONSUMER: ${{ runner.temp }}/doppler-candidate/consumer
        run: node .consumer-reploid/tests/fixtures/doppler-installed-generation.js > "$RUNNER_TEMP/doppler-candidate/reploid-receipt.json"
      - name: Preserve exact archive and portable consumer evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: installed-consumer-candidate
          path: |
            ${{ runner.temp }}/doppler-candidate/*.tgz
            ${{ runner.temp }}/doppler-candidate/*.json
            ${{ runner.temp }}/doppler-candidate/consumer/*.js
            ${{ runner.temp }}/doppler-candidate/consumer/*.json
          if-no-files-found: error
