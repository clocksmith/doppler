name: Exact encrypted CPU arithmetic experiment
on:
  workflow_dispatch:
    inputs:
      stream_storage:
        description: 'Run the bounded public-tile storage probe instead of the arithmetic benchmark'
        type: boolean
        default: false
      prefill5_full_tile:
        description: 'With stream_storage, run only the full 2048-by-2048 five-row native profile tile'
        type: boolean
        default: false
      process_resources:
        description: 'With stream_storage, use separate native processes for all installed Flash tile shapes plus partial metadata pressure'
        type: boolean
        default: false
      packing_benchmark:
        description: 'Also compare original, serial NTT and parallel packing before the separate-process resource probe'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-ntt.yml'
      - 'tools/privacy-concrete/native-ntt/**'
permissions:
  contents: read
jobs:
  native-equivalence:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-ntt-check]')
    concurrency:
      group: exact-encrypted-ntt
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.91.1'
      RAYON_NUM_THREADS: '4'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - name: Validate explicit optional probe selection
        if: (inputs.prefill5_full_tile && !inputs.stream_storage) || (inputs.process_resources && (!inputs.stream_storage || inputs.prefill5_full_tile))
        run: |
          echo 'Choose one storage probe; process_resources requires stream_storage and excludes prefill5_full_tile'
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU build tooling
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          python -m pip install --no-cache-dir 'maturin==1.16.0' 'numpy==1.26.4'
      - name: Prepare and verify the exact public source variant
        run: |
          python tools/privacy-concrete/native-ntt/prepare.py --destination "$RUNNER_TEMP/concrete-ntt-source"
          python tools/privacy-concrete/native-ntt/check_lock.py "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock"
          cp "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock" "$RUNNER_TEMP/ntt-Cargo.lock"
      - name: Build separate CPU-only native variant
        working-directory: ${{ runner.temp }}/concrete-ntt-source
        run: maturin build --manifest-path rust/Cargo.toml --no-default-features --features python_bindings --profile release_lto_off --locked --out "$RUNNER_TEMP/ntt-wheels" --interpreter python
      - name: Install pinned client dependencies for the optional storage probe
        if: inputs.stream_storage
        env:
          CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Check independent public process fixtures before generating keys
        if: inputs.process_resources
        env:
          PYTHONPATH: tools/privacy-concrete
          DOPPLER_FLASH_REFERENCE: '1'
          HF_HOME: ${{ runner.temp }}/native-process-fixture-hf
        run: python -m unittest test_native_process_fixture test_flash_compute_budget test_resource_memory test_check_policy test_checked_bridge -v
      - name: Install this exact variant in the isolated runner
        run: python -m pip install --no-deps "$RUNNER_TEMP"/ntt-wheels/*.whl
      - name: Check native imports before generating keys
        run: |
          python - <<'PY'
          import concrete_ml_extensions as ext
          import concrete_ml_extensions.concrete_ml_extensions as binary
          from importlib.metadata import version
          assert version('concrete-ml-extensions') == '0.1.9+ntt.7'
          assert callable(ext.cpu_prepare_ntt_key) and callable(ext.cpu_matrix_multiplication_ntt)
          assert not ext.is_cuda_enabled()
          print(version('concrete-ml-extensions'))
          PY
      - name: Compare exact ciphertext bytes and measure the two CPU paths
        if: ${{ !inputs.stream_storage || inputs.packing_benchmark }}
        run: |
          python tools/privacy-concrete/native-ntt/benchmark.py --lock "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock" \
            > "$RUNNER_TEMP/ntt-public-result.json" 2> "$RUNNER_TEMP/ntt-client-diagnostics.txt"
      - name: Reject native ciphertext corruption and replay cancellation before parser entry
        if: ${{ !inputs.stream_storage || inputs.packing_benchmark }}
        env:
          PYTHONPATH: tools/privacy-concrete
        run: python tools/privacy-concrete/native-ntt/test_integrity.py -v
      - name: Execute four native encrypted feedback steps with no endpoint coefficient files
        if: inputs.stream_storage && !inputs.process_resources
        env:
          DOPPLER_STREAM_NATIVE: '1'
          DOPPLER_STREAM_NATIVE_FULL_TILE: ${{ inputs.prefill5_full_tile && '1' || '0' }}
          DOPPLER_STREAM_NATIVE_REPORT: ${{ runner.temp }}/stream-storage-native.json
          PYTHONPATH: tools/privacy-concrete
        run: |
          if [ "$DOPPLER_STREAM_NATIVE_FULL_TILE" = '1' ]; then
            python -m unittest test_stream_native.StreamNativeTests.test_full_sized_five_row_profile_tile_then_single_row_feedback -v
          else
            python -m unittest test_stream_native -v
          fi
      - name: Measure separate native processes across all installed tile shapes under enforced resources
        if: inputs.process_resources
        run: |
          sudo systemd-run --wait --pipe --collect --unit="a2-native-process-${GITHUB_RUN_ID}" \
            --uid="$(id -u)" -p Type=exec -p MemoryMax=8G -p MemorySwapMax=0 -p CPUQuota=800% -p OOMPolicy=kill \
            -p WorkingDirectory="$GITHUB_WORKSPACE" \
            /usr/bin/env OMP_NUM_THREADS=4 RAYON_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 MKL_NUM_THREADS=4 \
            PYTHONPATH="$GITHUB_WORKSPACE/tools/privacy-concrete" HF_HOME="$RUNNER_TEMP/native-process-hf" \
            "$(command -v python)" tools/privacy-concrete/native_process_probe.py \
            --output "$RUNNER_TEMP/native-process-resources.json"
      - name: Retain owned resource-unit outcome including failures
        if: always() && inputs.process_resources
        run: sudo journalctl -u "a2-native-process-${GITHUB_RUN_ID}.service" --no-pager -o short-iso > "$RUNNER_TEMP/native-process-unit.txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-exact-ntt-public-evidence
          path: |
            ${{ runner.temp }}/ntt-public-result.json
            ${{ runner.temp }}/ntt-Cargo.lock
            ${{ runner.temp }}/stream-storage-native.json
            ${{ runner.temp }}/checkpoint-rebuild-native.json
            ${{ runner.temp }}/checkpoint-rebuild-prefill5-native.json
            ${{ runner.temp }}/checkpoint-rebuild-prefill5-full-tile-native.json
            ${{ runner.temp }}/native-process-resources.json
            ${{ runner.temp }}/native-process-unit.txt
          if-no-files-found: warn
          retention-days: 7
