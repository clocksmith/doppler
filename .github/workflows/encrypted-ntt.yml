name: Exact encrypted CPU arithmetic experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/encrypted-ntt.yml'
      - 'tools/privacy-concrete/native-ntt/**'
permissions:
  contents: read
jobs:
  native-equivalence:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-ntt-check]')
    concurrency:
      group: exact-encrypted-ntt
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.91.1'
      RAYON_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU build tooling
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          python -m pip install --no-cache-dir 'maturin==1.16.0' 'numpy==1.26.4'
      - name: Prepare and verify the exact public source variant
        run: |
          python tools/privacy-concrete/native-ntt/prepare.py --destination "$RUNNER_TEMP/concrete-ntt-source"
          cargo generate-lockfile --locked --manifest-path "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.toml"
          python tools/privacy-concrete/native-ntt/check_lock.py "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock"
          cp "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock" "$RUNNER_TEMP/ntt-Cargo.lock"
      - name: Build separate CPU-only native variant
        working-directory: ${{ runner.temp }}/concrete-ntt-source
        run: maturin build --manifest-path rust/Cargo.toml --no-default-features --features python_bindings --profile release_lto_off --locked --out "$RUNNER_TEMP/ntt-wheels" --interpreter python
      - name: Install this exact variant in the isolated runner
        run: python -m pip install --no-deps "$RUNNER_TEMP"/ntt-wheels/*.whl
      - name: Check native imports before generating keys
        run: |
          python - <<'PY'
          import concrete_ml_extensions as ext
          import concrete_ml_extensions.concrete_ml_extensions as binary
          from importlib.metadata import version
          assert version('concrete-ml-extensions') == '0.1.9+ntt.1'
          assert callable(ext.cpu_prepare_ntt_key) and callable(ext.cpu_matrix_multiplication_ntt)
          assert not ext.is_cuda_enabled()
          print(version('concrete-ml-extensions'))
          PY
      - name: Compare exact ciphertext bytes and measure the two CPU paths
        run: |
          python tools/privacy-concrete/native-ntt/benchmark.py --lock "$RUNNER_TEMP/concrete-ntt-source/rust/Cargo.lock" \
            > "$RUNNER_TEMP/ntt-public-result.json" 2> "$RUNNER_TEMP/ntt-client-diagnostics.txt"
      - name: Reject native ciphertext corruption and replay cancellation before parser entry
        env:
          PYTHONPATH: tools/privacy-concrete
        run: python tools/privacy-concrete/native-ntt/test_integrity.py -v
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-exact-ntt-public-evidence
          path: |
            ${{ runner.temp }}/ntt-public-result.json
            ${{ runner.temp }}/ntt-Cargo.lock
          if-no-files-found: warn
          retention-days: 7
