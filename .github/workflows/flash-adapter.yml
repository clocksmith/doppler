name: Flash streaming adapter integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flash-adapter.yml'
      - 'tools/privacy-concrete/flash_mlp.py'
      - 'tools/privacy-concrete/full_model.py'
      - 'tools/privacy-concrete/integer_reference.py'
      - 'tools/privacy-concrete/full_bridge.py'
      - 'tools/privacy-concrete/test_full_bridge.py'
      - 'tools/privacy-concrete/test_flash_moe_cancellation.py'
      - 'tools/privacy-concrete/flash_moe.py'
      - 'tools/privacy-concrete/flash_component_plan.py'
      - 'tools/privacy-concrete/flash_ple_model.py'
      - 'tools/privacy-concrete/flash_ple_plan.py'
      - 'tools/privacy-concrete/flash_weights.py'
      - 'tools/privacy-concrete/public_weights.py'
      - 'tools/privacy-concrete/flash_stage_source.py'
      - 'tools/privacy-concrete/flash_streamed_moe.py'
      - 'tools/privacy-concrete/flash_prepared_graph.py'
      - 'tools/privacy-concrete/flash_generation.py'
      - 'tools/privacy-concrete/flash_generate_run.py'
      - 'tools/privacy-concrete/flash-resource-policy.json'
      - 'tools/privacy-concrete/flash-checkpoint-reference.json'
      - 'tools/privacy-concrete/flash_checkpoint_reference.py'
      - 'tools/privacy-concrete/test_flash_checkpoint_reference.py'
      - 'tools/privacy-concrete/flash_float_reference.py'
      - 'tools/privacy-concrete/test_flash_float_reference.py'
      - 'tools/privacy-concrete/test_flash_graph_source.py'
      - 'tools/privacy-concrete/test_flash_generate_run.py'
      - 'tools/privacy-concrete/client_progress.py'
      - 'tools/privacy-concrete/test_client_progress.py'
      - 'tools/privacy-concrete/resource_memory.py'
      - 'tools/privacy-concrete/test_resource_memory.py'
      - 'tools/privacy-concrete/flash_compute_budget.py'
      - 'tools/privacy-concrete/native_process_fixture.py'
      - 'tools/privacy-concrete/test_native_process_fixture.py'
      - 'tools/privacy-concrete/local_bf16_rows.py'
      - 'tools/privacy-concrete/local_token_rows.py'
      - 'tools/privacy-concrete/local_ngram_rows.py'
      - 'tools/privacy-concrete/flash_quantized_reference.py'
      - 'tools/privacy-concrete/test_flash_quantized_reference.py'
      - 'tools/privacy-concrete/flash_text_stream_plan.py'
      - 'tools/privacy-concrete/flash_text_rebuild_plan.py'
      - 'tools/privacy-concrete/flash_text_rebuild5_plan.py'
      - 'tools/privacy-concrete/flash_provider_source.py'
      - 'tools/privacy-concrete/coefficient_plan.py'
      - 'tools/privacy-concrete/public_tile_stream.py'
      - 'tools/privacy-concrete/full_provider.py'
      - 'tools/privacy-concrete/test_public_tile_stream.py'
      - 'tools/privacy-concrete/test_flash_stream_storage.py'
      - 'tools/privacy-concrete/test_stream_transport.py'
      - 'tools/privacy-concrete/test_checkpoint_fixture.py'
      - 'tools/privacy-concrete/test_provider_checkpoint.py'
      - 'tools/privacy-concrete/test_chunked_preparation.py'
      - 'tools/privacy-concrete/test_public_columns.py'
      - 'tools/privacy-concrete/test_streamed_preparation.py'
      - 'tools/privacy-concrete/test_flash_moe_native.py'
      - 'tools/privacy-concrete/flash*tokenizer*'
      - 'tools/privacy-concrete/prepare_flash_tokenizer.py'
      - 'tools/privacy-concrete/test_flash_tokenizer*'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      RAYON_NUM_THREADS: '2'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned public-reference adapter implementation
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Compare complete streaming MLP composition and failure order
        env:
          DOPPLER_CONCRETE_NATIVE: '1'
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_native.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_full_bridge.py -v
          python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_cancellation.py -v
      - name: Check bounded coefficient preparation against the installed quantizer
        env:
          DOPPLER_FLASH_REFERENCE: '1'
        run: |
          cd tools/privacy-concrete
          python -m unittest test_chunked_preparation test_public_columns test_streamed_preparation -v
      - name: Provision only the inspected public operator source for tiny storage fixtures
        env:
          PYTHONPATH: tools/privacy-concrete
        run: python -c 'import os; from flash_reference import provision_reference; provision_reference(os.path.join(os.environ["RUNNER_TEMP"],"flash-stream-reference"))'
      - name: Check evictable client storage and framed evaluator with no coefficient cache
        env:
          DOPPLER_FLASH_REFERENCE: '1'
          DOPPLER_FLASH_SOURCE_DIR: ${{ runner.temp }}/flash-stream-reference
        run: |
          cd tools/privacy-concrete
          python -m unittest test_public_tile_stream test_flash_stream_storage test_flash_encrypted_graph_adapter test_provider_checkpoint test_flash_quantized_reference test_flash_float_reference test_flash_graph_source test_flash_generate_run test_flash_checkpoint_reference test_client_progress test_resource_memory test_native_process_fixture test_flash_compute_budget -v
      - name: Provision only the exact public Flash tokenizer
        run: python tools/privacy-concrete/prepare_flash_tokenizer.py --destination "$RUNNER_TEMP/flash-tokenizer"
      - name: Check real Flash text input and output using local pinned files
        env:
          DOPPLER_FLASH_TOKENIZER_DIR: ${{ runner.temp }}/flash-tokenizer
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_flash_tokenizer_native.py -v
          python tools/privacy-concrete/flash_tokenizer.py --source-dir "$RUNNER_TEMP/flash-tokenizer" --public-fixture flash-public-capital-text > "$RUNNER_TEMP/flash-public-text-io.json"
      - uses: actions/upload-artifact@v6
        with:
          name: actual-flash-public-text-io
          path: ${{ runner.temp }}/flash-public-text-io.json
          if-no-files-found: error
          retention-days: 7
