name: Flash streaming adapter integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flash-adapter.yml'
      - 'tools/privacy-concrete/flash_mlp.py'
      - 'tools/privacy-concrete/full_model.py'
      - 'tools/privacy-concrete/flash_moe.py'
      - 'tools/privacy-concrete/flash_component_plan.py'
      - 'tools/privacy-concrete/flash_ple_model.py'
      - 'tools/privacy-concrete/flash_ple_plan.py'
      - 'tools/privacy-concrete/flash_weights.py'
      - 'tools/privacy-concrete/test_flash_moe_native.py'
      - 'tools/privacy-concrete/flash*tokenizer*'
      - 'tools/privacy-concrete/prepare_flash_tokenizer.py'
      - 'tools/privacy-concrete/test_flash_tokenizer*'
permissions:
  contents: read
jobs:
  adapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      RAYON_NUM_THREADS: '2'
      CMAKE_ARGS: '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned public-reference adapter implementation
        run: |
          python -m pip install --no-cache-dir 'torch==2.3.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r tools/privacy-concrete/requirements.txt 'safetensors==0.8.0'
      - name: Compare complete streaming MLP composition and failure order
        env:
          DOPPLER_CONCRETE_NATIVE: '1'
        run: python -m unittest discover -s tools/privacy-concrete -p test_flash_moe_native.py -v
      - name: Provision only the exact public Flash tokenizer
        run: python tools/privacy-concrete/prepare_flash_tokenizer.py --destination "$RUNNER_TEMP/flash-tokenizer"
      - name: Check real Flash text input and output using local pinned files
        env:
          DOPPLER_FLASH_TOKENIZER_DIR: ${{ runner.temp }}/flash-tokenizer
        run: |
          python -m unittest discover -s tools/privacy-concrete -p test_flash_tokenizer_native.py -v
          python tools/privacy-concrete/flash_tokenizer.py --source-dir "$RUNNER_TEMP/flash-tokenizer" --public-fixture flash-public-capital-text > "$RUNNER_TEMP/flash-public-text-io.json"
      - uses: actions/upload-artifact@v6
        with:
          name: actual-flash-public-text-io
          path: ${{ runner.temp }}/flash-public-text-io.json
          if-no-files-found: error
          retention-days: 7
