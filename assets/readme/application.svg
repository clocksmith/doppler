<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
<title id="title">Doppler keeps a working model inside your application</title>
<desc id="desc">Rig prepares a Capsule upstream of the application. Inside the application, Doppler retains weights and prepared programs. A current request produces an answer while a later request approaches the same loaded resources. Operations depend on supported models.</desc>
