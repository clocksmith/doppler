<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 736" width="360" height="736" role="img" aria-labelledby="title desc">
<title id="title">Doppler keeps a model inside your application</title>
<desc id="desc">Rig prepares a Capsule outside the application. Inside the application, successive requests use the same retained model weights and prepared programs. Doppler returns an answer. Generation, embeddings, reranking and scoring depend on the supported model.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
