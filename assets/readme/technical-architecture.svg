<text x="588" y="643" font-size="12" fill="#657083" font-weight="400" text-anchor="start">Close: reject new work → drain → release owned state</text>
<text x="36" y="696" font-size="14" fill="#657083" font-weight="400" text-anchor="start">JSON declares execution. JavaScript orchestrates. WGSL computes. Operations depend on the selected model program.</text>
