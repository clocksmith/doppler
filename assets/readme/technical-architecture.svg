<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Doppler: technical architecture</title>
<desc id="desc">Ten components connect Rig and signed Capsules to runtime verification, artifact storage, operation sessions, resident model state, command execution, and WebGPU. The diagram separates model opening from repeated operations and shows both resource reuse and returned results.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:14px;font-weight:500;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style>
