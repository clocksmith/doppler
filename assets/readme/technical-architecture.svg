<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Doppler: technical architecture</title><desc id="desc">Purple containment shows Rig and a signed Capsule entering verified opening. A reusable session retains model resources and accepts successive operations through a lease, model program, binder and command executor. The host and WebGPU provider remain external.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.edge-label{paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7542c8" stroke-width="1.6"/></marker><marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657083" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="1198" height="718" rx="18" fill="white" stroke="#dce1e9" stroke-width="1.4"/>
<text x="36" y="43" font-size="24" fill="#7542c8" font-weight="700" text-anchor="start">doppler</text>
<text x="1164" y="42" font-size="11" fill="#657083" font-weight="600" text-anchor="end">TECHNICAL ARCHITECTURE</text>
<text x="36" y="84" font-size="25" fill="#202735" font-weight="600" text-anchor="start">Open once. Reuse the session. Settle each operation.</text>
